
networks:
  crowdsec-net:
    name: crowdsec-net

services:

  crowdsec:

    image: crowdsecurity/crowdsec:${IMAGE_TAG:-latest}
    container_name: crdsec-hub
    hostname: crdsec-hub
    restart: always

    networks:
      - crowdsec-net

    volumes:
      - ./data:/var/lib/crowdsec/data
      - ./config:/etc/crowdsec

    environment:
      COLLECTIONS: "${COLLECTIONS:-crowdsecurity/linux}"
      # Off by default, matching ../crdsectl's own install (see its
      # install_crowdsec()) - CAPI is a third-party data-sharing
      # relationship, not something this tool should opt an install into
      # without an explicit admin choice. Confirmed against the real
      # Docker entrypoint source (2026-08-24, build/docker/docker_start.sh):
      # only skips registration when this is true, checked before ever
      # calling "cscli capi register". Opt in with "crdsec-hub.sh capi
      # register" any time afterward.
      DISABLE_ONLINE_API: "true"

  nginx:

    image: nginx:alpine
    container_name: crowdsec-nginx
    hostname: ${HUB_HOST:-localhost}
    restart: always
    depends_on:
      - crowdsec

    networks:
      - crowdsec-net

    ports:
      - "${NGINX_HTTPS_PORT:-8443}:443"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/run/secrets/tls:ro
