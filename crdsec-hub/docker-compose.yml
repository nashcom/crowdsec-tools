
networks:
  crowdsec-net:
    name: crowdsec-net

services:

  crowdsec:

    image: crowdsecurity/crowdsec:${IMAGE_TAG:-latest}
    container_name: crdsec-hub
    hostname: crdsec-hub
    restart: always

    networks:
      - crowdsec-net

    volumes:
      - ./data:/var/lib/crowdsec/data
      - ./config:/etc/crowdsec

    environment:
      COLLECTIONS: "${COLLECTIONS:-crowdsecurity/linux}"

  nginx:

    image: nginx:alpine
    container_name: crowdsec-nginx
    hostname: ${HUB_HOST:-localhost}
    restart: always
    depends_on:
      - crowdsec

    networks:
      - crowdsec-net

    ports:
      - "${NGINX_HTTPS_PORT:-8443}:443"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/run/secrets/tls:ro
