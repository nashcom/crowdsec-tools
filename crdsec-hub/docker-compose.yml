
networks:
  crowdsec-net:
    name: crowdsec-net

services:

  crowdsec:

    image: crowdsecurity/crowdsec:${IMAGE_TAG:-latest}
    container_name: crdsec-hub
    hostname: crdsec-hub
    restart: always

    networks:
      - crowdsec-net

    volumes:
      - ./data:/var/lib/crowdsec/data
      - ./config:/etc/crowdsec

    environment:
      COLLECTIONS: "${COLLECTIONS:-crowdsecurity/linux}"
      # Off by default, matching ../crdsectl's own install - CAPI is a
      # third-party data-sharing relationship, not something this tool
      # should opt an install into without an explicit admin choice.
      # Shell/`.env`-overridable default (not hardcoded): the entrypoint
      # deletes api.server.online_client on every start where this is
      # true, so "crdsec-hub.sh capi register" persists false to .env
      # rather than a one-shot override, which would just get wiped again
      # on the next ordinary restart.
      DISABLE_ONLINE_API: "${DISABLE_ONLINE_API:-true}"

  nginx:

    image: nginx:alpine
    container_name: crowdsec-nginx
    hostname: ${HUB_HOST:-localhost}
    restart: always
    depends_on:
      - crowdsec

    networks:
      - crowdsec-net

    ports:
      - "${NGINX_HTTPS_PORT:-8443}:443"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/run/secrets/tls:ro
