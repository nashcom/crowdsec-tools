# crowdsec-net is shared with the agent test rig (../crdsectl/run-install-test-container.sh) for
# when it's NOT run with --network host. Compose creates/owns it (name:
# pins the actual network name instead of compose's default project-
# prefixed one) - NOT external:true, since that requires the network to
# already exist and errors out otherwise if this comes up first. run-install-test-container.sh's
# bridge mode still does its own idempotent "docker network create" as a
# fallback for when the agent container starts before this does.
networks:
  crowdsec-net:
    name: crowdsec-net

services:

  crowdsec:

    image: crowdsecurity/crowdsec:${IMAGE_TAG:-latest}
    container_name: crdsec-hub
    hostname: crdsec-hub
    restart: always

    networks:
      - crowdsec-net

    # Lets this container resolve the Docker host itself as
    # host.docker.internal - reliable on Docker Desktop already, but
    # plain Docker Engine (e.g. WSL2 without Desktop) needs this explicit
    # opt-in. Only actually used for ad hoc host-side debugging (e.g. a
    # temporary local webhook receiver), not by anything in normal operation.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./data:/var/lib/crowdsec/data
      - ./config:/etc/crowdsec

    environment:
      COLLECTIONS: "${COLLECTIONS:-crowdsecurity/linux}"

  nginx:

    image: nginx:alpine
    container_name: crowdsec-nginx
    hostname: ${HUB_HOST:-localhost}
    restart: always
    depends_on:
      - crowdsec

    networks:
      - crowdsec-net

    ports:
      - "${NGINX_HTTPS_PORT:-8443}:443"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/run/secrets/tls:ro
